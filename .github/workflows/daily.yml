name: 每日晨間財經 Podcast

on:
  schedule:
    # GitHub 排程是「盡力而為」，尖峰時段可能延遲或漏跑，所以排 4 個時間互相備援。
    # 第一個成功後，其餘會自動略過。時間為 UTC：週日～週四 = 台灣時間 週一～週五
    - cron: "17 21 * * 0-4"   # 台灣 05:17
    - cron: "47 21 * * 0-4"   # 台灣 05:47
    - cron: "17 22 * * 0-4"   # 台灣 06:17
    - cron: "47 22 * * 0-4"   # 台灣 06:47（最後補救）
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=自動判斷；weekday=平日版；monday=週一週末彙整版"
        default: auto
        type: choice
        options: [auto, weekday, monday]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # 取最新版，才看得到前一次排程是否已完成

      - id: check
        name: 檢查今天是否已產生
        run: |
          today=$(TZ=Asia/Taipei date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"$today.mp3\"" state/episodes.json; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天（$today）的節目已產生，本次略過"
          fi

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - id: pages
        if: steps.check.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: 產生今日節目
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: python -m podcast.main

      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        if: steps.check.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: 存回集數紀錄
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/episodes.json
          git diff --cached --quiet || git commit -m "新增節目 $(TZ=Asia/Taipei date +%F)"
          git push
