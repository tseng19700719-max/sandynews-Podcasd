name: 每日晨間財經 Podcast

on:
  schedule:
    # 21:30 UTC（週日～週四）= 台灣時間 週一～週五 05:30
    - cron: "30 21 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=自動判斷；weekday=平日版；monday=週一週末彙整版"
        default: auto
        type: choice
        options: [auto, weekday, monday]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: 產生今日節目
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: python -m podcast.main

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 存回集數紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/episodes.json
          git diff --cached --quiet || git commit -m "新增節目 $(TZ=Asia/Taipei date +%F)"
          git push
